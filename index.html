<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>《特朗普大战拜登》</title>
    <!-- tvb-qa24-arrive-vanish-cap -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+SC:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <section id="title" class="screen show">
        <div class="hero">
          <div class="hero-left">
            <div class="brand">
              <h1>《特朗普大战拜登》</h1>
              <small>Trump vs Biden</small>
            </div>
            <div class="hero-card">
            <div class="explain">
              <p>1. 点自己亮着的州，有视野就能出兵抢地；可滑过多州一起出兵。</p>
              <p>2. 迷雾只亮你领地和部队周围一圈，靠边打边探。</p>
              <p>3. 建房拿房间码，好友输码进房；开麦报州名，州多的赢。</p>
            </div>
            <div class="row">
              <label class="field">昵称
                <input id="name" maxlength="12" placeholder="玩家" />
              </label>
              <label class="field">房间码
                <input id="code" maxlength="4" placeholder="加入时填写" autocomplete="off" inputmode="text" />
              </label>
            </div>
            <div class="row">
              <div class="seg" id="mode">
                <button data-mode="1v1" class="on">1v1 对战</button>
                <button data-mode="2v2">双人同边打 AI</button>
              </div>
              <div class="seg" id="faction">
                <button data-faction="trump" class="on">特朗普红</button>
                <button data-faction="biden">拜登蓝</button>
              </div>
            </div>
            <div class="row">
              <label class="field">老家
                <div class="seg" id="homes"></div>
              </label>
            </div>
            <div class="cta">
              <button class="big create" id="btn-create">创建房间</button>
              <button class="big join" id="btn-join">加入房间</button>
            </div>
            <div class="cta music-row">
              <button class="ghost" id="btn-bgm" type="button">音乐</button>
              <div class="bgm-tracks" id="bgm-tracks" role="group" aria-label="背景音乐">
                <button type="button" data-track="march" class="on">进行曲</button>
                <button type="button" data-track="charge">冲击</button>
                <button type="button" data-track="mega">MEGA</button>
              </div>
            </div>
            <button class="ghost" id="btn-ai">人机试玩（单人立刻开打）</button>
            <div class="rules">
              红方特朗普老家三选一：德州、佛州、俄亥俄。蓝方拜登老家三选一：加州、纽约、宾州。<br />
              2v2 同边以密西西比河为界。同阵营共享迷雾与胜负。
            </div>
            </div>
          </div>
          <figure class="hero-portrait" id="hero-carousel" aria-roledescription="carousel">
            <div class="hero-track" id="hero-track">
              <div class="hero-slide on" data-name="特朗普">
                <img src="/trump.jpg?v=5" alt="特朗普" draggable="false" />
              </div>
              <div class="hero-slide" data-name="拜登">
                <img src="/biden.jpg?v=5" alt="拜登" draggable="false" />
              </div>
            </div>
            <figcaption id="hero-caption">特朗普</figcaption>
            <div class="hero-dots" id="hero-dots" role="tablist">
              <button type="button" class="on" data-i="0" aria-label="特朗普"></button>
              <button type="button" data-i="1" aria-label="拜登"></button>
            </div>
          </figure>
        </div>
      </section>

      <section id="play" class="screen">
        <div class="stage" id="stage">
          <div class="map-viewport" id="map-viewport">
            <div class="map-world" id="map-world">
              <svg class="map" id="map" xmlns="http://www.w3.org/2000/svg"></svg>
              <canvas class="fx" id="fx"></canvas>
            </div>
          </div>

          <header class="hud-top">
            <button class="icon-btn" id="btn-leave" type="button">返回</button>
            <div class="hud-stats">
              <span class="code" id="room-code">----</span>
              <span id="score">红 0 · 蓝 0</span>
              <span id="clock">04:30</span>
            </div>
            <button class="icon-btn" id="btn-hud" type="button" aria-expanded="false">面板</button>
          </header>

          <div class="radio" id="radio" aria-live="polite">
            <div class="radio-cat">【指挥】</div>
            <div class="radio-line">点己方州，有视野就能出兵</div>
            <div class="radio-feed" id="radio-feed"></div>
          </div>

          <div class="callout" id="callout"><strong>州名</strong><span>点己方州，有视野就能出兵</span></div>

          <div class="chips" id="chips" hidden></div>

          <div class="send-bar" id="send-bar">
            <button class="icon-btn" id="btn-chips" type="button" aria-pressed="true">喊话</button>
            <button class="icon-btn" id="btn-mic" type="button">开麦</button>
            <button class="icon-btn" id="btn-mute" type="button">扬声器</button>
            <button class="icon-btn" id="btn-sfx" type="button">音效</button>
            <button class="icon-btn" id="btn-bgm-hud" type="button">音乐</button>
          </div>

          <div class="origin-badge" id="origin-badge" hidden>
            <strong>起点</strong>
            <span id="origin-name"></span>
            <button type="button" id="btn-cancel-origin">取消</button>
          </div>

          <div class="sheet-bg" id="sheet-bg"></div>
          <aside class="sheet" id="sheet">
            <div class="sheet-handle" id="sheet-handle">玩家 · 聊天</div>
            <div class="players" id="players"></div>
            <div class="seg" id="lobby-homes"></div>
            <button class="start" id="btn-start" type="button">开始游戏</button>
            <div class="chat">
              <input id="chat" maxlength="140" placeholder="文字聊天（语音不通时用这个）" />
              <button class="icon-btn" id="btn-chat" type="button">发送</button>
            </div>
            <div class="log" id="log"></div>
          </aside>

          <div class="tutorial" id="tutorial" hidden>
            <ol id="tutorial-steps"></ol>
            <button type="button" id="btn-tutorial" class="start">知道了</button>
          </div>
          <div class="banner" id="banner" hidden>对方掉线，等待重连 15s</div>
          <div class="overlay" id="connecting">
            <div>正在连房间…</div>
          </div>
          <div class="overlay" id="result">
            <div>
              <h2 id="result-title">胜负已分</h2>
              <p id="result-reason"></p>
              <div class="result-banter" id="result-banter"></div>
              <button class="start" id="btn-rematch" type="button">再来一局</button>
            </div>
          </div>
        </div>
      </section>
    </div>
    <div class="toast" id="toast"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
